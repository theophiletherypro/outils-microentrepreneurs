<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — Labosept</title>
    <meta name="robots" content="noindex, follow">
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #1a1a1a;
            --accent-color: #0066cc;
            --border-color: #e5e5e5;
            --muted-text: #666666;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content {
            max-width: 600px;
            margin: auto;
            padding: 2rem 1rem;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin: 0 0 1rem 0;
            color: var(--text-color);
        }

        p {
            font-size: 1.25rem;
            color: var(--muted-text);
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--text-color);
            color: #fff;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <main class="content">
        <h1>404</h1>
        <p>Cette page a probablement filé en laboratoire ou n'existe pas encore. Pas de panique, le guide est là.</p>
        <a href="index.html" class="btn">Retourner à l'accueil</a>
    </main>

</body>
</html>
