<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labosept — Le Laboratoire des Micro-Entrepreneurs et Auto-Entrepreneurs Solos</title>
    <meta name="description" content="Des outils de gestion automatisés, des solutions de visibilité et un accompagnement pas à pas pour les solopreneurs. Zéro blabla, de l'action.">
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #1a1a1a;
            --accent-color: #0066cc;
            --border-color: #e5e5e5;
            --card-bg: #ffffff;
            --muted-text: #666666;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            color: var(--text-color);
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        /* Système de Sommaire Déroulant (Dropdown) */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }

        .dropdown-btn:hover {
            background-color: #f5f5f5;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: var(--card-bg);
            min-width: 240px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            z-index: 10;
            margin-top: 0.5rem;
            padding: 0.5rem 0;
        }

        .dropdown-content a {
            color: var(--text-color);
            padding: 0.75rem 1rem;
            text-decoration: none;
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
        }

        .dropdown-content a:hover {
            background-color: #f5f5f5;
            color: var(--accent-color);
        }

        /* Affiche le sommaire au survol */
        .dropdown:hover .dropdown-content {
            display: block;
        }

        .btn-nav {
            background-color: var(--text-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .btn-nav:hover {
            background-color: var(--accent-color);
        }

        .hero {
            max-width: 800px;
            margin: 5rem auto;
            text-align: center;
            padding: 0 1rem;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--muted-text);
            margin-bottom: 2rem;
        }

        .badge-rule {
            display: inline-block;
            background-color: #f0f0f0;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .grid-cibles {
            max-width: 1100px;
            margin: 0 auto 5rem auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-top: 0;
            font-weight: 700;
        }

        .card p {
            color: var(--muted-text);
            font-size: 1rem;
            flex-grow: 1;
        }

        .tag-status {
            align-self: flex-start;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .tag-free { background-color: #e6f4ea; color: #137333; }
        .tag-premium { background-color: #e8f0fe; color: #1a73e8; }
        .tag-deploy { background-color: #fce8e6; color: #c5221f; }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 1.5rem 0;
        }

        .item-list li {
            padding: 0.5rem 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.95rem;
        }

        .btn {
            display: block;
            text-align: center;
            background-color: var(--text-color);
            color: #fff;
            padding: 0.75rem 1rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            margin-top: 1rem;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-color);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
        }

        .btn-secondary:hover {
            background-color: #f5f5f5;
            color: var(--text-color);
        }

        .newsletter-box {
            max-width: 650px;
            margin: 0 auto 5rem auto;
            background-color: #f9f9f9;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 3rem 2rem;
            text-align: center;
        }

        .newsletter-box h3 {
            font-size: 1.75rem;
            margin-top: 0;
        }

        .newsletter-form {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .newsletter-form input[type="email"] {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
        }

        .newsletter-form button {
            background-color: var(--text-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        .newsletter-form button:hover {
            background-color: var(--accent-color);
        }

        /* Nouveau Pied de page Professionnel */
        footer {
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            padding: 4rem 1rem 2rem 1rem;
            margin-top: 5rem;
        }

        .footer-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2.5rem;
            padding-bottom: 3rem;
        }

        .footer-brand h4 {
            font-size: 1.2rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .footer-brand p {
            font-size: 0.9rem;
            color: var(--muted-text);
            line-height: 1.5;
        }

        .footer-links h5 {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 0;
            margin-bottom: 1.2rem;
            color: var(--text-color);
        }

        .footer-links ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-links li {
            margin-bottom: 0.75rem;
        }

        .footer-links a {
            color: var(--muted-text);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        .footer-bottom {
            max-width: 1100px;
            margin: 0 auto;
            border-top: 1px solid var(--border-color);
            padding-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--muted-text);
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
